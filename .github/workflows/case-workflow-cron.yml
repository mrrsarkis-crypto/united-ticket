name: Case workflow reminders

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  run-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Run scheduled case workflow pass
        env:
          CRON_SECRET: ${{ secrets.CASE_WORKFLOW_CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ]; then
            echo "CASE_WORKFLOW_CRON_SECRET is not configured; skipping safely."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --header "X-Case-Workflow-Cron-Secret: ${CRON_SECRET}" \
            --data '{}' \
            "https://unitedtraffictickets.com/api/cases/admin/workflow"
