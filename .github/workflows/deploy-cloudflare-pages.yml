# Deploy static site + Pages Functions to Cloudflare Pages via the Pages
# deployment API on every push to main.
#
# Cloudflare credentials are stored only as GitHub Actions secrets.

name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate JavaScript
        run: npm test

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy public --project-name=ticket-fighter

      - name: Verify production runtime configuration
        run: |
          # Use the *.pages.dev alias, not the custom domain: the custom domain
          # is behind Bot Fight Mode, which 403s datacenter IPs like GitHub
          # Actions runners. The Pages zone has no such filter. The pages.dev
          # deployment serves the same Worker and environment, so it fully
          # validates the production runtime configuration.
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --retry-delay 3 \
            https://ticket-fighter.pages.dev/api/health
