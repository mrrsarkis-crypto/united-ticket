name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-22.04
    steps:
      # Production scanner deployment checkpoint: runs after every main push.
      # Deployment checkpoint: production scanner/TR-205 serving verification.
      # Source-of-truth build is already on main; this commit re-triggers connected deployment automation.
      # 2026-09-29 production publish trigger: run the completed scanner build now.
      # 2026-09-29 re-trigger: publish the scanner fallback fix.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run scanner and application tests
        run: npm test

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy public --project-name ticket-fighter --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
