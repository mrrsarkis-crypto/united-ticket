name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax check workflow files
        run: |
          node --check functions/api/_deadline-utils.js
          node --check functions/api/deadlines/index.js
          node --check functions/api/_google-calendar.js
          node --check functions/api/_google-oauth.js
          node --check functions/api/_welcome-email.js
          node --check functions/api/_tr205.js
          node --check functions/api/cases/[code].js
          node --check functions/api/cases/_tbwd.js
          node --check functions/api/cases/_package.js
          node --check functions/api/cases/admin/package.js
          node --check functions/api/cases/admin/workflow.js
          node --check functions/api/cases/admin/sync.js
          node --check functions/api/case-documents.js
          node --check functions/api/case-document.js
          node --check functions/api/intake/claim.js
          node --check functions/api/webhook.js
          node --check public/case.js
      - name: Run project tests
        run: npm test
